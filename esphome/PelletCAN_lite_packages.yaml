    update_interval: never
  - platform: template
    id: mixer_ret_state
    name: "Mieszacz powrotu stan"
    accuracy_decimals: 0
    icon: "mdi:valve"
    update_interval: never
  - platform: template
    id: burner_power
    name: "Moc palnika"
    unit_of_measurement: "%"
    update_interval: never
  - platform: template
    id: burner_kw
    name: "Palnik moc"
    unit_of_measurement: "kW"
