# =====================================================================
# PelletCAN lite - RDZEN firmware (logika, CAN, encje). Pobierany przez ESPHome z GitHuba przy kazdej kompilacji (packages).
# NIE edytuj lokalnie - swoje ustawienia masz w pliku PelletCAN_lite.yaml.
# Historia zmian: CHANGELOG-firmware.md
# =====================================================================
# Estyma Igneo Touch (CAN I/O BIG) -> Home Assistant, wersja LITE:
#  - TYLKO ODCZYT: ESP wysyla do kotla wylacznie zapytania o rejestry (SDO 0x40), nigdy zapisu; brak uslug (actions), przyciskow i przelacznikow.
#  - jeden obieg CO, bez harmonogramow zapisu, nastaw, trybow, testu wyjsc, historii alarmow, skanerow i podsluchu magistrali.
#  - XIAO ESP32-C6 + Seeed CAN Bus Breakout (MCP2515, kwarc 16 MHz), CANopen SDO, wezel kotla 0x04, 125 kbit/s.
# Encje (nazwy jak w pelnym PelletCAN, wiec karta dziala z nimi tak samo): temperatury, pompy, palnik, zbiornik, podajniki, alarm, tryby (tylko tekst), harmonogramy (tylko do podgladu).
substitutions:
  fw_version: "2.0"

esphome:
  # name / friendly_name, esp32, logger, web_server, captive_portal oraz klucz API sa w pliku uzytkownika (PelletCAN_lite.yaml).
  on_boot:
    priority: 600
    then:
      - if:
          condition:
            lambda: 'return std::string("${external_antenna}") == "true";'
          then:
            - output.turn_off: rf_switch_enable
            - delay: 100ms
            - output.turn_on: rf_ant_select

ota:
  - platform: esphome
    password: ${ota_password}

wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_password}
  fast_connect: true
  # Awaryjny punkt dostepu: gdy ESP nie polaczy sie z siecia, po ok. 1 min wystawia siec "Tekla-Estyma Fallback" (haslo: ap_pass).
  ap:
    ssid: "Tekla-Estyma Fallback"
    password: ${ap_pass}
  # Staly adres IP (opcjonalny): blok "wifi: manual_ip" w pliku uzytkownika; bez niego ESP bierze adres z DHCP.

globals:
  # Alarmy: najnowszy wpis bufora (kod + czas poczatku i konca) -> encja "Alarm aktywny"
  - id: alarm_slot
    type: int
    initial_value: "-1"
  - id: alarm_t0
    type: uint32_t
    initial_value: "0"
  - id: alarm_code_now
    type: int
    initial_value: "0"
  - id: alarm_flag_active
    type: bool
    initial_value: "false"
  # Historia alarmow (20 slotow: kod 0x4010+i, poczatek 0x4024+i, koniec 0x4038+i) - tylko odczyt
  - id: ah_raw
    type: std::vector<uint32_t>
  - id: ah_t0
    type: std::vector<uint32_t>
  - id: ah_t1
    type: std::vector<uint32_t>
  - id: ah_txt
    type: std::vector<std::string>
  - id: alarm_last_slot
    type: int
    initial_value: "-1"
  - id: alarm_pos
    type: int
    initial_value: "-1"
  - id: alarm_flag_conf
    type: bool
    initial_value: "false"
  - id: ah_boot
    type: bool
    initial_value: "false"
  # Kolejka odczytu ustawien poziomu podstawowego (tylko odczyt)
  - id: par_q
    type: std::vector<uint16_t>
  - id: par_boot
    type: bool
    initial_value: "false"
  # Harmonogramy (24 bity na dzien, bit i = godzina i, 1 = komfort): CWU, CO obwod 1, kociol - tylko odczyt
  - id: sch_cwu
    type: std::vector<int32_t>
  - id: sch_co
    type: std::vector<int32_t>
  - id: sch_boil
    type: std::vector<int32_t>
  - id: sch_burst
    type: int
    initial_value: "0"
  - id: sch_k
    type: int
    initial_value: "0"
  - id: sch_boot
    type: bool
    initial_value: "false"

# Plytka Seeed CAN Bus Breakout na XIAO ESP32-C6.
# SPI: SCK=D8 (GPIO19), MISO=D9 (GPIO20), MOSI=D10 (GPIO18), CS=D7 (GPIO17).
# Zworka P1 na spodzie plytki = terminator 120 ohm (domyslnie rozlaczona).
spi:
  clk_pin: GPIO19
  mosi_pin: GPIO18
  miso_pin: GPIO20

canbus:
  - platform: mcp2515
    id: igneo_can
    cs_pin: GPIO17
    can_id: 0x604          # nasze zapytania SDO do kotla (wezel 4)
    bit_rate: 125KBPS      # predkosc magistrali panelu Igneo Touch
    clock: 16MHZ           # kwarc plytki Seeed (nadruk 16.000)
    data_rate: 1MHz        # wolniejsze SPI = pewniejsza komunikacja z MCP2515
    # UWAGA: LISTENONLY wylaczylby wysylanie zapytan - nie uzywac.
    on_frame:
      # PDO modulu CAN IO BIG (wezel 86) 0x456: bajt 0 bit 0 = podajnik glowny pracuje.
      - can_id: 0x456
        then:
          - lambda: |-
              if (x.size() < 1) return;
              id(feeder_running).publish_state((x[0] & 0x01) != 0);
      # PDO 0x356: bajt 0 bit 0 = dmuchawa pracuje, bajt 2 bit 0 = podajnik palnika pracuje.
      - can_id: 0x356
        then:
          - lambda: |-
              if (x.size() < 1) return;
              id(blower_running).publish_state((x[0] & 0x01) != 0);
              if (x.size() >= 3) id(feeder2_running).publish_state((x[2] & 0x01) != 0);
      # Odpowiedzi kotla (wezel 4) na zapytania SDO: 0x580 + 4.
      - can_id: 0x584
        then:
          - lambda: |-
              if (x.size() < 8) return;
              const uint8_t cs = x[0];
              const uint16_t idx = x[1] | (x[2] << 8);
              const uint8_t sub = x[3];
              // Odpowiedz upload expedited (0x42/0x43/0x4x): dane w 4 bajtach; inne (abort, potwierdzenia, segmenty) pomijamy.
              if ((cs & 0xE0) != 0x40 || !(cs & 0x02) || sub != 0x01) return;
              const bool size_given = (cs & 0x01);
              const int n = size_given ? 4 - ((cs >> 2) & 0x03) : 4;
              uint32_t raw = 0;
              for (int i = 0; i < n; i++) raw |= ((uint32_t) x[4 + i]) << (8 * i);
              // Harmonogramy: CWU 0x2154..0x2159 + 0x2160 (niedziela), CO obwod 1 = 0x2126 + 4*dzien, kociol 0x2209..0x220F.
              {
                int ci = -1, oi = -1, bi = -1;
                if (idx >= 0x2154 && idx <= 0x2159) ci = idx - 0x2154; else if (idx == 0x2160) ci = 6;
                if (idx >= 0x2126 && idx <= 0x2141 && ((idx - 0x2126) % 4) == 0) oi = (idx - 0x2126) / 4;
                if (idx >= 0x2209 && idx <= 0x220F) bi = idx - 0x2209;
                if (ci >= 0 || oi >= 0 || bi >= 0) {
                  if (id(sch_cwu).size() != 7) id(sch_cwu).assign(7, -1);
                  if (id(sch_co).size() != 7) id(sch_co).assign(7, -1);
                  if (id(sch_boil).size() != 7) id(sch_boil).assign(7, -1);
                  if (ci >= 0) id(sch_cwu)[ci] = (int32_t) (raw & 0xFFFFFF);
                  if (oi >= 0) id(sch_co)[oi] = (int32_t) (raw & 0xFFFFFF);
                  if (bi >= 0) id(sch_boil)[bi] = (int32_t) (raw & 0xFFFFFF);
                  auto join_hex = [](const std::vector<int32_t> &v) {
                    std::string o;
                    char t[12];
                    for (size_t k = 0; k < v.size(); k++) {
                      if (v[k] < 0) snprintf(t, sizeof(t), "------"); else snprintf(t, sizeof(t), "%06X", (unsigned) v[k]);
                      if (k) o += ' ';
                      o += t;
                    }
                    return o;
                  };
                  if (ci >= 0) id(sch_cwu_txt).publish_state(join_hex(id(sch_cwu)));
                  if (oi >= 0) id(sch_co_txt).publish_state(join_hex(id(sch_co)));
                  if (bi >= 0) id(sch_boil_txt).publish_state(join_hex(id(sch_boil)));
                  return;
                }
              }
              // Skala: pomiary w dziesiatych stopnia; wartosci zadane kotla podaje w pelnych stopniach.
              float div = 10.0f;
              switch (idx) {
                case 0x2003: case 0x2004: case 0x2010: case 0x2012: case 0x201A: case 0x22AD:
                  div = 1.0f;
                  break;
                default: break;
              }
              // Pompy i stan palnika: wartosc w mlodszym bajcie (starszy bajt = 1 to flaga).
              const uint32_t low = raw & 0xFF;
              // Tylko dolne 16 bitow (gorne bajty ramki bywaja smieciami).
              const float t = (float) (int16_t) (raw & 0xFFFF) / div;

              // --- bufor alarmow: 0x404C = nastepna pozycja, 0x4010+i = alarm i ---
              if (idx == 0x404C) {
                // Rejestr = 256 + pozycja (0..19); najnowszy alarm = pozycja-1 (potwierdzone znacznikami czasu).
                const int oldpos = id(alarm_pos);
                id(alarm_pos) = (int) (raw & 0xFF);
                const int last = ((int) (raw & 0xFF) + 19) % 20;
                id(alarm_last_slot) = last;
                if (oldpos != id(alarm_pos) && id(ah_boot)) id(alarm_hist_q).execute();  // nowy alarm -> przeladuj cala historie
                std::vector<uint8_t> d = {0x40, (uint8_t) ((0x4010 + last) & 0xFF), (uint8_t) ((0x4010 + last) >> 8), 0x01, 0, 0, 0, 0};
                id(igneo_can)->send_data(0x604, false, d);
                return;
              }
              if (idx >= 0x4010 && idx < 0x4024) {
                const int hs = (int) (idx - 0x4010);
                if (id(ah_raw).size() < 20) { id(ah_raw).assign(20, 0); id(ah_t0).assign(20, 0); id(ah_t1).assign(20, 0); id(ah_txt).assign(20, std::string()); }
                id(ah_raw)[hs] = raw;
                const bool is_last = (hs == id(alarm_last_slot)) || id(alarm_last_slot) < 0;
                if (is_last) id(alarm_slot) = hs;
                const uint32_t code = raw & 0xFFFF;
                const bool active = (raw >> 16) & 1;
                const bool confirmed = (raw >> 17) & 1;
                // Nazwy alarmow: dopisuj kolejne kody, gdy je poznasz (z panelu / bufora alarmow).
                const char *aname = "";
                switch (code) {
                  case 1: aname = " (czujnik kotla)"; break;
                  case 2: aname = " (przegrzanie kotla)"; break;
                  case 3: aname = " (czujnik powrotu)"; break;
                  case 4: aname = " (czujnik temp. podajnika)"; break;
                  case 5: aname = " (STB)"; break;
                  case 6: aname = " (przegrzanie podajnika)"; break;
                  case 7: aname = " (lancuch bezpieczenstwa)"; break;
                  case 8: aname = " (czujnik spalin)"; break;
                  case 20: aname = " (czujnik pokojowy CO1)"; break;
                  case 21: aname = " (czujnik pokojowy CO2)"; break;
                  case 22: aname = " (czujnik pokojowy CO3)"; break;
                  case 23: aname = " (czujnik pokojowy CO4)"; break;
                  case 24: aname = " (czujnik CO1)"; break;
                  case 25: aname = " (czujnik CO2)"; break;
                  case 26: aname = " (czujnik CO3)"; break;
                  case 27: aname = " (czujnik CO4)"; break;
                  case 30: aname = " (czujnik CWU)"; break;
                  case 31: aname = " (czujnik bufora gora)"; break;
                  case 32: aname = " (czujnik bufora dol)"; break;
                  case 40: aname = " (czujnik solar 1)"; break;
                  case 41: aname = " (czujnik solar 2)"; break;
                  case 42: aname = " (czujnik solar 3)"; break;
                  case 43: aname = " (czujnik solar 4)"; break;
                  case 50: aname = " (rezerwa paliwa)"; break;
                  case 51: aname = " (brak paliwa w zasobniku)"; break;
                  case 100: aname = " (brak komunikacji z modulem 0)"; break;
                  case 101: aname = " (brak komunikacji z modulem 1)"; break;
                  case 102: aname = " (brak komunikacji z modulem 2)"; break;
                  case 103: aname = " (brak komunikacji z modulem 3)"; break;
                  case 104: aname = " (brak komunikacji z modulem 4)"; break;
                  case 105: aname = " (brak komunikacji z modulem 5)"; break;
                  case 106: aname = " (brak komunikacji z modulem 6)"; break;
                  case 107: aname = " (brak komunikacji z modulem 7)"; break;
                  case 110: aname = " (brak komunikacji z modulem BIG)"; break;
                  case 115: aname = " (brak komunikacji z modulem lambda)"; break;
                  case 116: aname = " (brak komunikacji z modulem MINI 0)"; break;
                  case 117: aname = " (brak komunikacji z modulem MINI 1)"; break;
                  case 118: aname = " (brak komunikacji z modulem MINI 2)"; break;
                  case 119: aname = " (brak komunikacji z modulem MINI 3)"; break;
                  case 120: aname = " (brak komunikacji z modulem MINI 4)"; break;
                  case 121: aname = " (brak komunikacji z modulem MINI 5)"; break;
                  case 122: aname = " (brak komunikacji z modulem MINI 6)"; break;
                  case 123: aname = " (brak komunikacji z modulem MINI 7)"; break;
                  case 130: aname = " (faza czyszczenia)"; break;
                  case 131: aname = " (blad wygaszania)"; break;
                  case 140: aname = " (brak ognia/opalu)"; break;
                  case 150: aname = " (dodatkowy magazyn: brak paliwa/max)"; break;
                  case 151: aname = " (dodatkowy magazyn: rezerwa)"; break;
                  case 160: aname = " (wymiennik do czyszczenia)"; break;
                  case 161: aname = " (palnik do czyszczenia)"; break;
                  case 200: aname = " (ruszt)"; break;
                  case 201: aname = " (awaria dmuchawy)"; break;
                  case 202: aname = " (drzwi kotla otwarte)"; break;
                  case 203: aname = " (bardzo niski poziom tlenu)"; break;
                  default: break;
                }
                char a[96];
                snprintf(a, sizeof(a), "kod %u%s%s%s", (unsigned) code, aname, active ? ", aktywny" : "", confirmed ? ", oczekuje" : "");
                id(ah_txt)[hs] = (code == 0) ? std::string() : std::string(a);
                id(ah_publish).execute(hs);
                if (!is_last) return;  // odczyt historii: nie ruszamy "ostatniego alarmu"
                id(alarm_last_text).publish_state(code == 0 ? "brak" : a);
                id(alarm_code_now) = (int) code;
                id(alarm_flag_active) = active;
                id(alarm_flag_conf) = confirmed;
                if (code == 0) { id(alarm_active).publish_state(false); id(alarm_start_text).publish_state("0"); id(alarm_end_text).publish_state("0"); return; }
                // lancuch odczytow: czas poczatku (0x4024+slot), potem czas konca (0x4038+slot)
                const int sl = (int) (idx - 0x4010);
                std::vector<uint8_t> d = {0x40, (uint8_t) ((0x4024 + sl) & 0xFF), (uint8_t) ((0x4024 + sl) >> 8), 0x01, 0, 0, 0, 0};
                id(igneo_can)->send_data(0x604, false, d);
                return;
              }
              if (idx >= 0x4024 && idx < 0x4038) {
                if (id(ah_raw).size() < 20) { id(ah_raw).assign(20, 0); id(ah_t0).assign(20, 0); id(ah_t1).assign(20, 0); id(ah_txt).assign(20, std::string()); }
                id(ah_t0)[idx - 0x4024] = raw;
                id(ah_publish).execute((int) (idx - 0x4024));
                if ((int) (idx - 0x4024) != id(alarm_slot)) return;
              }
              if (idx >= 0x4024 && idx < 0x4038 && (int) (idx - 0x4024) == id(alarm_slot)) {
                id(alarm_t0) = raw;
                id(alarm_start_text).publish_state(std::to_string((unsigned) raw));
                const int sl = (int) (idx - 0x4024);
                std::vector<uint8_t> d = {0x40, (uint8_t) ((0x4038 + sl) & 0xFF), (uint8_t) ((0x4038 + sl) >> 8), 0x01, 0, 0, 0, 0};
                id(igneo_can)->send_data(0x604, false, d);
                return;
              }
              if (idx >= 0x4038 && idx < 0x404C) {
                if (id(ah_raw).size() < 20) { id(ah_raw).assign(20, 0); id(ah_t0).assign(20, 0); id(ah_t1).assign(20, 0); id(ah_txt).assign(20, std::string()); }
                id(ah_t1)[idx - 0x4038] = raw;
                id(ah_publish).execute((int) (idx - 0x4038));
                if ((int) (idx - 0x4038) != id(alarm_slot)) return;
              }
              if (idx >= 0x4038 && idx < 0x404C && (int) (idx - 0x4038) == id(alarm_slot)) {
                id(alarm_end_text).publish_state(std::to_string((unsigned) raw));
                // Aktywny: (flaga aktywnosci albo brak czasu zakonczenia / koniec przed poczatkiem)
                const bool open_end = (raw == 0) || (raw < id(alarm_t0));
                id(alarm_active).publish_state(id(alarm_code_now) != 0 && (id(alarm_flag_active) || open_end));
                return;
              }


              switch (idx) {
                case 0x2003: id(boiler_set_manual).publish_state(t); break;
                case 0x2146: id(ch1_set_manual).publish_state((float) low); break;
                case 0x2032: id(co_set_comfort).publish_state(t); break;
                case 0x2048: id(co_set_eco).publish_state(t); break;
                case 0x2273: id(air_corr).publish_state((float) (int16_t) (raw & 0xFFFF)); break;
                case 0x2270: id(power_min).publish_state((float) (raw & 0xFF)); break;
                case 0x2271: id(power_max).publish_state((float) (raw & 0xFF)); break;
                case 0x4000: id(ret_temp).publish_state(t); break;
                case 0x2208: id(boiler_hyst_on).publish_state((float) (raw & 0xFFFF)); break;
                case 0x2291: id(boiler_hyst_off).publish_state((float) (raw & 0xFFFF)); break;
                case 0x22BD: id(co1_hyst).publish_state((float) low / 10.0f); break;
                case 0x22C1: id(co1_calib).publish_state((float) (int16_t) (raw & 0xFFFF) / 10.0f); break;
                case 0x2142: id(co1_mode).publish_state((float) low); break;
                case 0x22C5: id(co1_curve_m20).publish_state((float) low); break;
                case 0x22C9: id(co1_curve_0).publish_state((float) low); break;
                case 0x22CD: id(co1_curve_10).publish_state((float) low); break;
                case 0x2212: id(cwu_hyst).publish_state((float) (raw & 0xFFFF)); break;
                case 0x2210: id(cwu_boost).publish_state((float) low); break;
                case 0x300D: id(cwu_prio).publish_state((float) low); break;
                case 0x2297: id(cwu_legion).publish_state((float) low); break;
                case 0x2001: id(boiler_temp).publish_state(t); break;
                case 0x2004: id(boiler_set_result).publish_state(t); break;
                case 0x4001: id(ch1_temp).publish_state(t); break;
                case 0x22AD: id(ch1_set_result).publish_state(t); break;
                case 0x2299: id(ch1_pump).publish_state(low != 0); break;
                case 0x22B9: id(mixer_co1_state).publish_state((float) low); break;
                case 0x216D: id(mixer_ret_state).publish_state((float) low); break;
                case 0x2110: id(hw_temp).publish_state(t); break;
                case 0x2010: id(hw_set_comfort).publish_state(t); break;
                case 0x2012: id(hw_set_eco).publish_state(t); break;
                case 0x201A: id(hw_set_result).publish_state(t); break;
                case 0x2278: id(hw_pump).publish_state(low != 0); break;
                case 0x215F: id(outside_temp).publish_state(t); break;
                case 0x226C: id(burner_temp).publish_state((float) (int16_t) (raw & 0xFFFF) / 10.0f); break;
                case 0x2272: id(fuel_test).publish_state((float) (raw & 0xFFFF) / 10.0f); id(burner_calc).execute(); break;
                case 0x2292: id(fuel_heat).publish_state((float) (raw & 0xFF) / 10.0f); id(burner_calc).execute(); break;
                case 0x4005: id(burner_power).publish_state((float) raw); id(burner_calc).execute(); break;
                case 0x2257: id(p_feed_max).publish_state((float) (raw & 0xFFFF) / 10.0f); id(burner_calc).execute(); break;
                case 0x3700: id(p_feeder_period).publish_state((float) (raw & 0xFFFF)); id(burner_calc).execute(); break;
                case 0x2250: id(burner_flame).publish_state((float) low); break;
                case 0x226D: id(burner_feed_time).publish_state((float) (raw & 0xFFFF) / 10.0f); break;
                case 0x2007: {
                  id(burner_state_code).publish_state((float) low);
                  char unk[32];
                  snprintf(unk, sizeof(unk), "nieznany (kod %u)", (unsigned) low);
                  const char *s = unk;
                  switch (low) {
                    case 0: s = "Wylaczony"; break;
                    case 1: s = "Rozpalanie"; break;
                    case 2: s = "Zarzenie"; break;
                    case 5: s = "Modulacja"; break;
                    case 6: s = "Wygaszanie / czyszczenie"; break;
                    case 7: s = "Czyszczenie"; break;
                    case 8: s = "Pauza"; break;
                    case 9: s = "Stop"; break;
                    case 10: s = "Alarm"; break;
                  }
                  id(burner_state_text).publish_state(s);
                  break;
                }
                case 0x2005: id(boiler_on).publish_state(low != 0); break;
                case 0x2002: {
                  char unk[32];
                  snprintf(unk, sizeof(unk), "nieznany (kod %u)", (unsigned) raw);
                  const char *s = unk;
                  switch (raw) {
                    case 0: s = "Czasowy auto"; break;
                    case 1: s = "Czasowy reczny"; break;
                    case 2: s = "Auto"; break;
                    case 3: s = "Reczny"; break;
                  }
                  id(boiler_mode_text).publish_state(s);
                  break;
                }
                case 0x2064:
                case 0x2014: {
                  const uint32_t m = raw & 0xFF;
                  const char *s = m == 0 ? "Off" : m == 1 ? "Eko" : m == 2 ? "Harmonogram" : m == 3 ? "Komfort" : "nieznany";
                  if (idx == 0x2064) id(co_mode_text).publish_state(s); else id(cwu_mode_text).publish_state(s);
                  break;
                }
                case 0x2006: id(in_zakaz).publish_state((raw & 1) == 0); break;   // 257 = brak zakazu, 256 = zakaz
                case 0x2254: id(blower_pct).publish_state((float) (raw & 0xFF)); break;
                case 0x3600: {
                  float c = (float) (raw & 0xFFFF);
                  id(tank_cap).publish_state(c);
                  float k = id(tank_kg).state;
                  if (c > 0 && !isnan(k)) id(tank_pct).publish_state(roundf(k * 100.0f / c));
                  break;
                }
                case 0x3601: {
                  float k = (float) (raw & 0xFFFF);
                  id(tank_kg).publish_state(k);
                  float c = id(tank_cap).state;
                  if (c > 0 && !isnan(c)) id(tank_pct).publish_state(roundf(k * 100.0f / c));
                  break;
                }
                default: break;
              }

interval:
  # Cykliczny odczyt rejestrow (jeden zapytanie na 250 ms). Tylko odczyt (SDO 0x40).
  - interval: 250ms
    then:
      - lambda: |-
          if (id(igneo_can)->is_failed()) return;  // brak MCP2515 - nie wysylamy
          static const uint16_t idxs[] = {
            0x2001, 0x2004,                                   // kociol: temperatura, zadana wynikowa
            0x4001, 0x22AD, 0x2299, 0x22B9, 0x216D,           // CO obwod 1: temperatura, zadana wynikowa, pompa; mieszacze (CO1, powrotu)
            0x2110, 0x2010, 0x2012, 0x201A, 0x2278,           // CWU: temperatura, zadana komfort / eco / wynikowa, pompa
            0x215F,                                           // temperatura zewnetrzna
            0x4005, 0x2007, 0x2002, 0x2005, 0x2254,           // moc palnika, stan palnika, tryb kotla, kociol wlaczony, obroty dmuchawy
            0x3600, 0x3601,                                   // zbiornik: pojemnosc, ilosc paliwa
            0x226C, 0x2250, 0x226D,                           // temperatura palnika, jasnosc plomienia, czas podawania palnika
            0x2272, 0x2292, 0x2257, 0x3700,                   // skladniki mocy kW i spalania (paliwo test, wartosc opalowa, podawanie max, okres)
            0x2064, 0x2014, 0x2006,                           // tryb pracy CO i CWU (tekst), zakaz rozpalenia
            0x404C                                            // alarmy: pozycja bufora -> potem odczyt ostatniego wpisu
          };
          static size_t i = 0;
          const size_t total = sizeof(idxs) / sizeof(idxs[0]);
          if (i >= total) i = 0;
          const uint16_t ix = idxs[i++];
          std::vector<uint8_t> d = {0x40, (uint8_t) (ix & 0xFF), (uint8_t) (ix >> 8), 0x01, 0, 0, 0, 0};
          id(igneo_can)->send_data(0x604, false, d);

  # Kolejka odczytu ustawien poziomu podstawowego + historia alarmow: jeden rejestr na 200 ms (tylko odczyt, SDO 0x40).
  # Po starcie (40 s) czytamy wszystko, potem ustawienia odswiezamy co 60 s (zmiany z panelu widac na karcie).
  - interval: 200ms
    then:
      - lambda: |-
          if (id(igneo_can)->is_failed()) return;
          static const uint16_t st[] = {0x2003,0x2146,0x2032,0x2048,0x2273,0x2270,0x2271,0x4000,0x2208,0x2291,0x22BD,0x22C1,0x2142,0x22C5,0x22C9,0x22CD,0x2212,0x2210,0x300D,0x2297};
          if (!id(par_boot) && millis() > 40000) {
            id(par_boot) = true;
            for (auto r : st) id(par_q).push_back(r);
            id(ah_boot) = true;
            id(alarm_hist_q).execute();
          }
          static uint32_t t_ref = 0;
          if (id(par_boot) && millis() - t_ref > 60000UL && id(par_q).empty()) {
            t_ref = millis();
            for (auto r : st) id(par_q).push_back(r);
          }
          auto &q = id(par_q);
          if (q.empty()) return;
          const uint16_t ix = q.front();
          q.erase(q.begin());
          std::vector<uint8_t> d = {0x40, (uint8_t) (ix & 0xFF), (uint8_t) (ix >> 8), 0x01, 0, 0, 0, 0};
          id(igneo_can)->send_data(0x604, false, d);

  # Harmonogramy (tylko do podgladu na karcie): 21 rejestrow co 300 ms, raz po starcie (30 s) i potem co 5 minut.
  - interval: 300ms
    then:
      - lambda: |-
          if (id(igneo_can)->is_failed()) return;
          if (!id(sch_boot) && millis() > 30000) { id(sch_boot) = true; id(sch_k) = 0; id(sch_burst) = 21; }
          if (id(sch_burst) <= 0) return;
          static const uint16_t sch[] = {0x2154,0x2155,0x2156,0x2157,0x2158,0x2159,0x2160,
            0x2126,0x212A,0x212E,0x2132,0x2136,0x213A,0x213E,
            0x2209,0x220A,0x220B,0x220C,0x220D,0x220E,0x220F};
          const uint16_t ix = sch[id(sch_k) % 21];
          id(sch_k)++;
          id(sch_burst)--;
          std::vector<uint8_t> d = {0x40, (uint8_t) (ix & 0xFF), (uint8_t) (ix >> 8), 0x01, 0, 0, 0, 0};
          id(igneo_can)->send_data(0x604, false, d);
  - interval: 5min
    then:
      - lambda: |-
          if (id(sch_boot) && id(sch_burst) <= 0) { id(sch_k) = 0; id(sch_burst) = 21; }

  # Status CAN widoczny w HA (encja "CAN OK") + stan poczatkowy PDO (PDO moze przychodzic tylko przy zmianie - po 30 s bez ramki zakladamy "nie pracuje").
  - interval: 5s
    then:
      - lambda: |-
          id(can_ok).publish_state(!id(igneo_can)->is_failed());
          if (millis() > 30000 && !id(feeder_running).has_state()) id(feeder_running).publish_state(false);
          if (millis() > 30000 && !id(feeder2_running).has_state()) id(feeder2_running).publish_state(false);
          if (millis() > 30000 && !id(blower_running).has_state()) id(blower_running).publish_state(false);

# Moc palnika [kW] i spalanie [kg/h] liczone w ESP (jak w pelnym PelletCAN): sprawnosc kotla 0,90 (moc), 0,85 (spalanie).
script:
  # Kolejkuje odczyt calej historii alarmow z kotla (20 slotow: kody, czasy poczatku i konca)
  - id: alarm_hist_q
    mode: single
    then:
      - lambda: |-
          auto &q = id(par_q);
          if (q.size() > 100) return;
          for (int i = 0; i < 20; i++) q.push_back((uint16_t) (0x4010 + i));
          for (int i = 0; i < 20; i++) q.push_back((uint16_t) (0x4024 + i));
          for (int i = 0; i < 20; i++) q.push_back((uint16_t) (0x4038 + i));
  # Publikuje wpis historii: "kod ...|poczatek (unix)|koniec (unix)"; pusty slot = "-"
  - id: ah_publish
    mode: queued
    max_runs: 60
    parameters:
      slot: int
    then:
      - lambda: |-
          if (slot < 0 || slot > 19 || id(ah_raw).size() < 20) return;
          text_sensor::TextSensor *s[] = {id(ah_0), id(ah_1), id(ah_2), id(ah_3), id(ah_4), id(ah_5), id(ah_6), id(ah_7), id(ah_8), id(ah_9), id(ah_10), id(ah_11), id(ah_12), id(ah_13), id(ah_14), id(ah_15), id(ah_16), id(ah_17), id(ah_18), id(ah_19)};
          std::string o = "-";
          if (!id(ah_txt)[slot].empty()) {
            char b[40]; snprintf(b, sizeof(b), "|%u|%u", (unsigned) id(ah_t0)[slot], (unsigned) id(ah_t1)[slot]);
            o = id(ah_txt)[slot] + b;
          }
          s[slot]->publish_state(o);
  - id: burner_calc
    mode: restart
    then:
      - lambda: |-
          const float test = id(fuel_test).state, tmax = id(p_feed_max).state, per = id(p_feeder_period).state;
          const float cv = id(fuel_heat).state, p = id(burner_power).state;
          if (isnan(test) || isnan(tmax) || isnan(per) || isnan(cv) || isnan(p) || per <= 0) return;
          const float kgh100 = test * tmax / per;
          const float kw = kgh100 * cv * 0.90f * p / 100.0f;
          id(burner_kw).publish_state(roundf(kw * 10.0f) / 10.0f);
          id(burner_fuel_rate).publish_state(roundf(kw / (cv * 0.85f) * 10.0f) / 10.0f);

