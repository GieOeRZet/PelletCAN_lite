    icon: "mdi:fire"
    update_interval: never
  - platform: template
    id: burner_fuel_rate
    name: "Palnik spalanie"
    unit_of_measurement: "kg/h"
    accuracy_decimals: 1
    icon: "mdi:grain"
    update_interval: never
  - platform: template
    id: burner_temp
    name: "Temperatura palnika"
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1
    update_interval: never
  - platform: template
    id: burner_flame
    name: "Palnik jasnosc plomienia"
    unit_of_measurement: "%"
